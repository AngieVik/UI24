name: CI — Calidad de código

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. Secretos y archivos sensibles
  # --------------------------------------------------------------------------
  secretos:
    name: Sin secretos en el repo
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ningún archivo .env commiteado (salvo .env.example)
        run: |
          LEAKED=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example' || true)
          if [ -n "$LEAKED" ]; then
            echo "❌ Archivos .env con posibles secretos en el índice git:"
            echo "$LEAKED"
            exit 1
          fi
          echo "✅ Sin archivos .env commiteados."

      - name: Detectar JWTs hardcodeados en código fuente
        run: |
          # Busca cadenas con formato JWT (header.payload.signature) en archivos de código.
          # Los JWTs válidos de Supabase miden > 100 caracteres.
          FOUND=$(grep -rE 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}' \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.sql" \
            --exclude-dir=node_modules --exclude-dir=.git \
            . || true)
          if [ -n "$FOUND" ]; then
            echo "❌ Posible JWT hardcodeado detectado:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ Sin JWTs hardcodeados."

  # --------------------------------------------------------------------------
  # 2. Convención de nombres de migraciones
  # --------------------------------------------------------------------------
  migraciones:
    name: Convención de migraciones
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar nomenclatura YYYYMMDDHHMMSS_descripcion.sql
        run: |
          FAIL=0
          for f in supabase/migrations/*.sql; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            if ! echo "$base" | grep -qE '^[0-9]{14}_[a-z0-9_]+\.sql$'; then
              echo "❌ Nombre inválido: $base"
              echo "   Formato esperado: YYYYMMDDHHMMSS_descripcion_snake_case.sql"
              FAIL=1
            fi
          done
          [ $FAIL -eq 0 ] && echo "✅ Todas las migraciones siguen la convención." || exit 1

  # --------------------------------------------------------------------------
  # 3. Frontend: build + lint + formato + tipos + tests (Sprint 5+)
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend (build + lint + prettier + tsc + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier (verificar formato)
        run: npm run format:check

      - name: TypeScript (verificar tipos)
        run: npm run typecheck

      - name: Tests unitarios
        run: npm test

      - name: Build de producción
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: placeholder-ci-key

      - name: Informe de tamaño del bundle
        run: |
          echo "📦 Chunks JS generados:"
          find dist/assets -name "*.js" -not -name "*.map" \
            -exec ls -lh {} \; | sort -k5 -h
          TOTAL=$(find dist/assets -name "*.js" -not -name "*.map" \
            | xargs wc -c | tail -1 | awk '{print $1}')
          echo ""
          echo "Total JS sin map: $((TOTAL / 1024)) KB"
          echo "(Límite: 3072 KB total · 800 KB entry chunk — verificado por bundleSizeGuard en Vite)"
