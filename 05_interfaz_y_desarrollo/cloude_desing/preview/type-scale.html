<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Type · Escala</title>
<link rel="stylesheet" href="_card.css">
<style>
  table { width: 100%; border-collapse: collapse; }
  td { padding: 8px 0; border-bottom: 1px solid var(--border-1); vertical-align: baseline; }
  td:first-child { width: 80px; color: var(--fg-3); font-family: var(--font-cmd); font-weight: 700; font-size: 11px; letter-spacing: .04em; }
  td:last-child  { width: 70px; color: var(--fg-3); font-family: var(--font-cmd); font-weight: 300; font-size: 11px; text-align: right; }
  .s-h1 { font-family: var(--font-cmd); font-weight: 700; font-size: 38px; line-height: 1.05; color: var(--fg-1); }
  .s-h2 { font-family: var(--font-cmd); font-weight: 700; font-size: 28px; line-height: 1.1;  color: var(--fg-1); }
  .s-h3 { font-family: var(--font-cmd); font-weight: 700; font-size: 22px; line-height: 1.15; color: var(--fg-1); }
  .s-h4 { font-family: var(--font-cmd); font-weight: 700; font-size: 17px; line-height: 1.2;  color: var(--fg-1); }
  .s-body { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--fg-1); }
  .s-meta { font-family: var(--font-cmd); font-weight: 300; font-size: 11px; color: var(--fg-3); }
</style>
</head>
<body class="card">
  <table>
    <tr><td>H1</td><td class="s-h1">Doc-8 del turno</td><td>38 / 1.05</td></tr>
    <tr><td>H2</td><td class="s-h2">Visor DRP activo</td><td>28 / 1.1</td></tr>
    <tr><td>H3</td><td class="s-h3">Operativa rutinaria</td><td>22 / 1.15</td></tr>
    <tr><td>H4</td><td class="s-h4">Repostar combustible</td><td>17 / 1.2</td></tr>
    <tr><td>BODY</td><td class="s-body">Las ambulancias operan en zonas de baja cobertura. La aplicación debe ser resiliente.</td><td>15 / 1.5</td></tr>
    <tr><td>META</td><td class="s-meta">Última sincronización · hace 12 min · 09:42 UTC</td><td>11 / 1.4</td></tr>
  </table>
</body></html>
