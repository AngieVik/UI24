<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Components · Tarjeta vehículo</title>
<link rel="stylesheet" href="_card.css">
<style>
  body.card { background: var(--u24-yellow); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .vcard {
    background: #fff;
    border: 1px solid var(--border-1);
    border-radius: 6px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .vcard__hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .vcard__id { font-family: var(--font-cmd); font-weight: 700; font-size: 16px; color: var(--fg-1); letter-spacing: -.01em; }
  .vcard__plate { font-family: var(--font-cmd); font-weight: 700; font-size: 12px; color: var(--fg-3); }
  .vcard__row { display: grid; grid-template-columns: 60px 1fr; gap: 8px; align-items: baseline; }
  .vcard__row .k { font-family: var(--font-cmd); font-weight: 700; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
  .vcard__row .v { font-family: var(--font-cmd); font-weight: 700; font-size: 12px; color: var(--fg-1); }
  .vcard__row .v.thin { font-weight: 300; }
  .vcard__badges { display: flex; gap: 6px; }
</style>
</head>
<body class="card">
  <div class="row">
    <div class="vcard">
      <div class="vcard__hd">
        <span class="vcard__id">A-04 <span class="vcard__plate">2847-LDH</span></span>
        <span class="badge badge--info">En ruta</span>
      </div>
      <div class="vcard__row"><span class="k">Pilot</span><span class="v">M. Álvarez</span></div>
      <div class="vcard__row"><span class="k">Carry</span><span class="v">R. Suárez</span></div>
      <div class="vcard__row"><span class="k">Servicio</span><span class="v">Guardia urgencias</span></div>
      <div class="vcard__row"><span class="k">Última</span><span class="v thin">09:42 UTC</span></div>
    </div>
    <div class="vcard">
      <div class="vcard__hd">
        <span class="vcard__id">A-07 <span class="vcard__plate">6193-KPB</span></span>
        <span class="badge badge--crit" style="font-weight:900">Alerta</span>
      </div>
      <div class="vcard__row"><span class="k">Pilot</span><span class="v">J. Pinto</span></div>
      <div class="vcard__row"><span class="k">Carry</span><span class="v">L. Ferrer</span></div>
      <div class="vcard__row"><span class="k">Servicio</span><span class="v">DRP Atlético-Sevilla</span></div>
      <div class="vcard__row"><span class="k">Última</span><span class="v thin">09:39 UTC</span></div>
    </div>
  </div>
</body></html>
