<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Components · Inputs</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .err { color: var(--crit); font-family: var(--font-cmd); font-weight: 500; font-size: 11px; }
  .check-row { display: flex; align-items: center; gap: 8px; font-family: var(--font-cmd); font-weight: 500; font-size: 13px; color: var(--fg-1); }
  .toggle {
    width: 32px; height: 18px; background: var(--bg-muted); border-radius: 999px; position: relative; border: 1px solid var(--border-2);
  }
  .toggle::after { content: ""; position: absolute; left: 2px; top: 1px; width: 14px; height: 14px; background: #fff; border-radius: 50%; box-shadow: var(--shadow-1); }
  .toggle.on { background: var(--u24-yellow); border-color: var(--u24-red-hover); }
  .toggle.on::after { left: 14px; }
  .seg {
    display: inline-flex; border: 1px solid var(--border-2); border-radius: var(--r-md); overflow: hidden; background: var(--bg-app);
  }
  .seg button { background: transparent; border: 0; padding: 5px 10px; font-family: var(--font-cmd); font-weight: 700; font-size: 12px; color: var(--fg-2); cursor: pointer; border-right: 1px solid var(--border-2); }
  .seg button:last-child { border-right: 0; }
  .seg button.active { background: var(--u24-black); color: #fff; }
</style>
</head>
<body class="card">
  <div class="grid">
    <div class="stack">
      <div class="field">
        <label>Matrícula</label>
        <input type="text" value="2847-LDH">
      </div>
      <div class="field">
        <label>km_fin</label>
        <input type="text" value="" placeholder="km recorridos">
        <span class="err">Campo obligatorio para cerrar turno</span>
      </div>
    </div>
    <div class="stack">
      <div class="field">
        <label>tipo_servicio</label>
        <select>
          <option>Programado</option>
          <option>Guardia urgencias</option>
          <option>Traslado</option>
          <option>DRP</option>
        </select>
      </div>
      <div class="check-row"><span class="toggle on"></span>IDEM al DRP</div>
      <div class="check-row"><span class="toggle"></span>Carry permanece en en_espera</div>
      <div>
        <div class="seg">
          <button class="active">Gasolinera</button>
          <button>Base</button>
        </div>
      </div>
    </div>
  </div>
</body></html>
