<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Type · Pesos &amp; uso</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .item { border: 1px solid var(--border-1); border-radius: 6px; padding: 12px; }
  .item .w { font-family: var(--font-cmd); font-size: 32px; color: var(--fg-1); letter-spacing: -.01em; line-height: 1; margin-bottom: 6px; }
  .item .lbl { font-family: var(--font-cmd); font-weight: 700; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
  .item .use { font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--fg-2); margin-top: 4px; line-height: 1.4; }
  .w300 { font-weight: 300; }
  .w500 { font-weight: 500; }
  .w700 { font-weight: 700; }
  .w900 { font-weight: 900; color: var(--crit); }
</style>
</head>
<body class="card">
  <div class="grid">
    <div class="item">
      <div class="w w300">300</div>
      <div class="lbl">Fino</div>
      <div class="use">Timestamps, fechas, metadatos secundarios.</div>
    </div>
    <div class="item">
      <div class="w w500">500</div>
      <div class="lbl">Medio</div>
      <div class="use">Cuerpos de texto, formularios y datos de entrada.</div>
    </div>
    <div class="item">
      <div class="w w700">700</div>
      <div class="lbl">Negrita</div>
      <div class="use">Etiquetas, matrículas, pacientes, navegación.</div>
    </div>
    <div class="item">
      <div class="w w900">900</div>
      <div class="lbl">Black · solo crítico</div>
      <div class="use">Alertas Doc-11, rotura de stock, emergencia.</div>
    </div>
  </div>
</body></html>
