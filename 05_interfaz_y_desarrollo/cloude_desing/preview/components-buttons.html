<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Components · Botones</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .label-row { font-family: var(--font-cmd); font-weight: 700; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); margin: 14px 0 6px; }
  .label-row:first-child { margin-top: 0; }
</style>
</head>
<body class="card">
  <div class="label-row">Botón · único estilo · negro con letras blancas</div>
  <div class="row">
    <button class="btn">Guardar Doc-8</button>
    <button class="btn">Confirmar recepción</button>
    <button class="btn">Cancelar</button>
    <button class="btn"><i class="ti ti-circle-plus"></i>Añadir asistencia Doc-1</button>
    <button class="btn" disabled style="opacity:.45;cursor:not-allowed">Guardar</button>
  </div>

  <div class="label-row">Destructivo · negro con letras rojas · sentence case</div>
  <div class="row">
    <button class="btn btn--destructive">Eliminar registro</button>
    <button class="btn btn--destructive">Cancelar DRP</button>
    <button class="btn btn--destructive"><i class="ti ti-trash"></i>Borrar dotación</button>
  </div>

  <div class="label-row">Button group · acciones relacionadas</div>
  <div class="row">
    <div class="btn-group">
      <button class="btn">Marcar en proceso</button>
      <button class="btn">Marcar solucionada</button>
      <button class="btn">Archivar</button>
    </div>
  </div>

  <div class="label-row">Hover</div>
  <div class="row">
    <button class="btn" style="background:#1f1f1f">Hover · #1f1f1f</button>
    <button class="btn btn--destructive" style="background:#1f1f1f">Hover destructivo</button>
  </div>
</body></html>
