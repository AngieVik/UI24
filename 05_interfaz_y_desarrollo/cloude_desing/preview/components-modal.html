<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Components · Modal</title>
<link rel="stylesheet" href="_card.css">
<style>
  body.card { background: var(--u24-yellow); padding: 14px; }
  .stage { position: relative; border-radius: 8px; overflow: hidden; min-height: 300px; background: rgba(0,0,0,.40); }
  .modal {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 480px;
    background: #fff;
    border: 1px solid var(--border-1);
    border-radius: 6px;
    box-shadow: var(--shadow-modal);
    overflow: hidden;
    color: var(--fg-1);
  }
  .modal__hd {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-1);
  }
  .modal__title { font-family: var(--font-cmd); font-weight: 700; font-size: 15px; color: var(--fg-1); }
  .modal__close {
    background: transparent; border: 0;
    width: 28px; height: 28px; font-size: 18px; cursor: pointer;
    color: var(--fg-2);
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 4px;
  }
  .modal__close:hover { background: var(--bg-muted); color: var(--fg-1); }
  .modal__body {
    padding: 14px;
    font-family: var(--font-body); font-weight: 500; font-size: 13px;
    color: var(--fg-2);
    line-height: 1.55;
  }
  .modal__body b { color: var(--fg-1); font-family: var(--font-cmd); font-weight: 700; }
  .modal__actions {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid var(--border-1);
    background: var(--bg-panel);
  }
</style>
</head>
<body class="card">
  <div class="stage">
    <div class="modal">
      <div class="modal__hd">
        <span class="modal__title">Confirmar asignación a DRP</span>
        <button class="modal__close" aria-label="Cerrar modal"><i class="ti ti-x"></i></button>
      </div>
      <div class="modal__body">
        Este vehículo (<b>A-04 · 2847-LDH</b>) ya está asignado al
        <b>DRP Atlético-Sevilla</b> en preparación. ¿Confirmar asignación a este nuevo DRP también?
      </div>
      <div class="modal__actions">
        <button class="btn">Cancelar</button>
        <button class="btn">Confirmar</button>
      </div>
    </div>
  </div>
</body></html>
