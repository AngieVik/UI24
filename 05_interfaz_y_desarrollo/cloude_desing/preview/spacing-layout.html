<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Spacing · Layout fijo</title>
<link rel="stylesheet" href="_card.css">
<style>
  body.card { padding: 18px; }
  .frame {
    border: 1px solid var(--border-1);
    border-radius: var(--r-md);
    overflow: hidden;
    display: grid;
    grid-template-columns: 52px 1fr;
    grid-template-rows: 52px 1fr;
    height: 240px;
  }
  .col-l { grid-row: 1 / span 2; background: var(--u24-column); position: relative; }
  .col-l::after {
    content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 22px; height: 22px; background: var(--u24-yellow); border-radius: 4px;
  }
  .hd2 { background: #111111; color: #fff; display: flex; align-items: center; padding: 0 12px; font-family: var(--font-cmd); font-weight: 700; font-size: 13px; }
  .home2 { background: var(--u24-yellow); padding: 16px; font-family: var(--font-cmd); font-weight: 700; color: #111; font-size: 13px; }
  .lab-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 14px; }
  .lab { font-family: var(--font-cmd); font-weight: 700; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
  .lab b { display: block; color: var(--fg-1); font-size: 13px; letter-spacing: 0; text-transform: none; font-weight: 700; margin-top: 2px; }
</style>
</head>
<body class="card">
  <div class="frame">
    <div class="col-l"></div>
    <div class="hd2">U24 · marquesina · header_h 52</div>
    <div class="home2">home_area · fondo amarillo · contenido variable</div>
  </div>
  <div class="lab-row">
    <div class="lab">black_column<b>52 px fijo</b></div>
    <div class="lab">header<b>52 px alto</b></div>
    <div class="lab">home_area<b>Resto disponible</b></div>
  </div>
</body></html>
