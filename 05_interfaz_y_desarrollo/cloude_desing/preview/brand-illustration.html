<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Brand · Ilustración corporativa</title>
<link rel="stylesheet" href="_card.css">
<style>
  body.card { padding: 0; }
  .wrap { display: grid; grid-template-columns: 240px 1fr; gap: 0; min-height: 260px; }
  .wrap .img { background: #fff; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .wrap .img img { max-height: 220px; }
  .wrap .info { padding: 22px; background: var(--bg-panel); border-left: 1px solid var(--border-1); display: flex; flex-direction: column; gap: 10px; }
  .wrap .info .h { font-family: var(--font-cmd); font-weight: var(--w-bold); font-size: 16px; color: var(--fg-1); }
  .wrap .info p { font-family: var(--font-body); font-weight: var(--w-med); font-size: 13px; color: var(--fg-2); line-height: 1.5; }
  .pill { align-self: flex-start; background: var(--warn-bg); color: var(--warn-fg); font-family: var(--font-cmd); font-weight: var(--w-bold); font-size: 11px; padding: 2px 8px; border-radius: 4px; letter-spacing: .02em; }
</style>
</head>
<body class="card">
  <div class="wrap">
    <div class="img"><img src="../assets/u24-illustration.png" alt="U24 corporate illustration"></div>
    <div class="info">
      <span class="h">Ilustración institucional</span>
      <p>Caduceos + estrella de la vida bajo arco U24. Reservado a splash de instalación PWA, materiales impresos y store listings.</p>
      <span class="pill">No usar dentro de la app</span>
    </div>
  </div>
</body></html>
