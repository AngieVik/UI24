<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Components · BannerOffline</title>
<link rel="stylesheet" href="_card.css">
<style>
  .banner {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border: 1px solid #fcd34d;
    background: #fef3c7;
    color: #92400e;
    font-family: var(--font-cmd);
    font-weight: 500;
    font-size: 13px;
    border-radius: 6px;
  }
  .banner i { font-size: 18px; }
  .banner b { font-weight: 700; }
  .banner.sync { background: #dbeafe; border-color: #93c5fd; color: #1e40af; }
  .banner.sync i { animation: spin 1s linear infinite; }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .lab { font-family: var(--font-cmd); font-weight: 700; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
</style>
</head>
<body class="card">
  <div class="stack">
    <div>
      <div class="lab" style="margin-bottom:6px">Offline persistente</div>
      <div class="banner">
        <i class="ti ti-wifi-off"></i>
        <span><b>Sin conexión</b> · Última sincronización: hace 12 min · Los partes de trabajo y registros clínicos siguen disponibles.</span>
      </div>
    </div>
    <div>
      <div class="lab" style="margin-bottom:6px">Sincronizando cola</div>
      <div class="banner sync">
        <i class="ti ti-refresh"></i>
        <span><b>Sincronizando datos…</b> 7 operaciones pendientes</span>
      </div>
    </div>
  </div>
</body></html>
