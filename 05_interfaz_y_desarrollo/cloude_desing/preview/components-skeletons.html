<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Components · LoadingSkeleton</title>
<link rel="stylesheet" href="_card.css">
<style>
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .grp { border: 1px solid var(--border-1); border-radius: 6px; padding: 12px; background: #fff; }
  .lab { font-family: var(--font-cmd); font-weight: 700; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 8px; }
  .pulse { background: #e5e7eb; border-radius: 4px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .skel-card { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 6px; }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid #d1d5db;
    border-top-color: #374151;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to{transform:rotate(360deg)} }
  .row { display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body class="card">
  <div class="stack">
    <div class="grp">
      <div class="lab">variant="card" rows={2}</div>
      <div class="skel-card">
        <div class="pulse" style="height:14px;width:66%"></div>
        <div class="pulse" style="height:10px;width:100%"></div>
        <div class="pulse" style="height:10px;width:78%"></div>
      </div>
      <div class="skel-card">
        <div class="pulse" style="height:14px;width:54%"></div>
        <div class="pulse" style="height:10px;width:100%"></div>
        <div class="pulse" style="height:10px;width:88%"></div>
      </div>
    </div>
    <div class="grp row">
      <div>
        <div class="lab">variant="spinner"</div>
        <div class="spinner"></div>
      </div>
      <div style="flex:1">
        <div class="lab">variant="row" columns={4}</div>
        <div class="row" style="gap:8px">
          <div class="pulse" style="height:12px;flex:1"></div>
          <div class="pulse" style="height:12px;flex:1"></div>
          <div class="pulse" style="height:12px;flex:1"></div>
          <div class="pulse" style="height:12px;flex:1"></div>
        </div>
      </div>
    </div>
  </div>
  <div style="font-family:var(--font-body);font-weight:300;font-size:11px;color:var(--fg-3);margin-top:10px;line-height:1.5">
    Solo en boot inicial (rehidratación IndexedDB), pull-to-refresh y primera carga sin caché. No usar para datos ya en Zustand.
  </div>
</body></html>
