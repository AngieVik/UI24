<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Spacing · Radii</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .box { width: 100%; height: 64px; background: #fff; border: 1px solid var(--border-2); }
  .lbl { font-family: var(--font-cmd); font-weight: 700; font-size: 11px; color: var(--fg-1); }
  .val { font-family: var(--font-cmd); font-weight: 300; font-size: 11px; color: var(--fg-3); }
  .pill { width: 100%; height: 24px; background: var(--neutral-bg); color: var(--neutral-fg); border-radius: 999px; display: flex; align-items: center; justify-content: center; font-family: var(--font-cmd); font-weight: 700; font-size: 11px; }
</style>
</head>
<body class="card">
  <div class="cap" style="margin-bottom:12px">Radios · conservadores</div>
  <div class="grid">
    <div class="demo"><div class="box" style="border-radius:2px"></div><span class="lbl">r-xs</span><span class="val">2 px · indicador</span></div>
    <div class="demo"><div class="box" style="border-radius:4px"></div><span class="lbl">r-sm</span><span class="val">4 px · badge</span></div>
    <div class="demo"><div class="box" style="border-radius:6px"></div><span class="lbl">r-md</span><span class="val">6 px · default</span></div>
    <div class="demo"><div class="box" style="border-radius:8px"></div><span class="lbl">r-lg</span><span class="val">8 px · modal</span></div>
    <div class="demo"><div class="pill">badge</div><span class="lbl">pill</span><span class="val">999 · avatar</span></div>
  </div>
</body></html>
