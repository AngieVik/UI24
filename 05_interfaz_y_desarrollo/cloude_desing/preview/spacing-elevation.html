<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Spacing · Elevación</title>
<link rel="stylesheet" href="_card.css">
<style>
  body.card { background: var(--bg-panel); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .e { background: #fff; border-radius: 8px; padding: 14px; min-height: 90px; }
  .e1 { box-shadow: var(--shadow-1); }
  .e2 { box-shadow: var(--shadow-2); }
  .em { box-shadow: var(--shadow-modal); }
  .e .name { font-family: var(--font-cmd); font-weight: 700; font-size: 12px; color: var(--fg-1); }
  .e .use  { font-family: var(--font-body); font-weight: 300; font-size: 11px; color: var(--fg-3); margin-top: 4px; line-height: 1.4; }
</style>
</head>
<body class="card">
  <div class="cap" style="margin-bottom:14px">Elevación · mínima · sin glow ni shadows coloreadas</div>
  <div class="grid">
    <div class="e e1"><div class="name">shadow-1</div><div class="use">Hover sobre tarjeta interactiva</div></div>
    <div class="e e2"><div class="name">shadow-2</div><div class="use">Dropdown, popover, tooltip</div></div>
    <div class="e em"><div class="name">shadow-modal</div><div class="use">Modal superpuesto sobre home_area</div></div>
  </div>
</body></html>
