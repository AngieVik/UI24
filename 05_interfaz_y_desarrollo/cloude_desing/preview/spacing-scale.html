<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Spacing · Escala</title>
<link rel="stylesheet" href="_card.css">
<style>
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row { display: grid; grid-template-columns: 50px 50px 1fr; gap: 16px; align-items: center; }
  .tok  { font-family: var(--font-cmd); font-weight: 700; font-size: 12px; color: var(--fg-1); }
  .val  { font-family: var(--font-cmd); font-weight: 300; font-size: 12px; color: var(--fg-3); text-align: right; }
  .bar  { height: 12px; background: var(--u24-yellow); border-radius: 2px; }
</style>
</head>
<body class="card">
  <div class="rows">
    <div class="row"><span class="tok">sp-1</span><span class="val">4 px</span><div class="bar" style="width:4px"></div></div>
    <div class="row"><span class="tok">sp-2</span><span class="val">8 px</span><div class="bar" style="width:8px"></div></div>
    <div class="row"><span class="tok">sp-3</span><span class="val">12 px</span><div class="bar" style="width:12px"></div></div>
    <div class="row"><span class="tok">sp-4</span><span class="val">16 px</span><div class="bar" style="width:16px"></div></div>
    <div class="row"><span class="tok">sp-5</span><span class="val">24 px</span><div class="bar" style="width:24px"></div></div>
    <div class="row"><span class="tok">sp-6</span><span class="val">32 px</span><div class="bar" style="width:32px"></div></div>
    <div class="row"><span class="tok">sp-8</span><span class="val">48 px</span><div class="bar" style="width:48px"></div></div>
  </div>
  <div style="font-family:var(--font-body);font-weight:300;font-size:11px;color:var(--fg-3);margin-top:14px">
    Regla minimalista: gap-1/p-2 por defecto, gap-3/p-3 en formularios. Sin paddings desproporcionados.
  </div>
</body></html>
