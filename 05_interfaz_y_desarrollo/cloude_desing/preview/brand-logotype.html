<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Brand · Logotype</title>
<link rel="stylesheet" href="_card.css">
<style>
  body.card { padding: 0; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; }
  .panel { padding: 24px; display: flex; align-items: center; justify-content: center; min-height: 240px; }
  .panel--light { background: #fff; }
  .panel--dark  { background: var(--u24-column); border-left: 1px solid var(--border-1); }
  .panel img { max-height: 200px; }
  .panel--dark img { filter: drop-shadow(0 0 0 #000); }
</style>
</head>
<body class="card">
  <div class="wrap">
    <div class="panel panel--light"><img src="../assets/u24-logotype-vertical.svg" alt="U24 Servicios Sanitarios logotype"></div>
    <div class="panel panel--dark"><img src="../assets/u24-logotype-vertical.svg" alt="U24 Servicios Sanitarios logotype"></div>
  </div>
</body></html>
