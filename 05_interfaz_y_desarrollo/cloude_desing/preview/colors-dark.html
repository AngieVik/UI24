<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Colors · Dark mode</title>
<link rel="stylesheet" href="_card.css">
<style>
  body.card { background: #09090b; color: #f9fafb; }
  .swatch { border-color: #3f3f46; }
  .swatch .meta { background: #18181b; border-top-color: #3f3f46; }
  .swatch .name { color: #f9fafb; }
  .swatch .hex { color: #9ca3af; }
</style>
</head>
<body class="card">
  <div class="col" style="gap:12px">
    <div class="cap" style="color:#9ca3af">Dark mode · Zinc + amarillo técnico mantenido como acento</div>
    <div class="row" style="gap:10px">
      <div class="swatch"><div class="chip" style="background:#09090b;color:#fff">09090B</div><div class="meta"><div class="name">bg-app</div><div class="hex">zinc-950</div></div></div>
      <div class="swatch"><div class="chip" style="background:#18181b;color:#fff">18181B</div><div class="meta"><div class="name">bg-panel</div><div class="hex">zinc-900</div></div></div>
      <div class="swatch"><div class="chip" style="background:#27272a;color:#fff">27272A</div><div class="meta"><div class="name">bg-muted</div><div class="hex">zinc-800</div></div></div>
      <div class="swatch"><div class="chip" style="background:#3f3f46;color:#fff">3F3F46</div><div class="meta"><div class="name">border</div><div class="hex">zinc-700</div></div></div>
      <div class="swatch"><div class="chip" style="background:#FFD60A;color:#111">FFD60A</div><div class="meta"><div class="name">Acento amarillo</div><div class="hex">--u24-yellow</div></div></div>
    </div>
  </div>
</body></html>
