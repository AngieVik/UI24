<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Components · Bandeja (mail con iniciales)</title>
<link rel="stylesheet" href="_card.css">
<style>
  body.card { background: var(--u24-yellow); }
  .panel {
    background: #fff;
    border-radius: 6px;
    padding: 14px;
    border: 1px solid var(--border-1);
  }
  .panel h { font-family: var(--font-cmd); font-weight: 700; font-size: 13px; color: var(--fg-1); margin: 0 0 10px; }
  .ppl { display: flex; gap: 10px; flex-wrap: wrap; }
  .person { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; }
  .person .ic {
    position: relative;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    background: var(--bg-muted);
    color: var(--fg-3);
    font-size: 22px;
  }
  .person .ic.un { color: var(--u24-red-hover); background: var(--u24-yellow-soft); }
  .person .ic .ini {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-cmd); font-weight: 900; font-size: 10px;
    color: var(--fg-1);
    pointer-events: none;
  }
  .person .ic .dot {
    position: absolute; top: 4px; right: 4px;
    width: 8px; height: 8px;
    background: var(--u24-yellow);
    border: 2px solid #fff;
    border-radius: 50%;
  }
  .person span.nm { font-family: var(--font-cmd); font-weight: 700; font-size: 11px; color: var(--fg-1); }
  .person span.ro { font-family: var(--font-cmd); font-weight: 300; font-size: 10px; color: var(--fg-3); }
</style>
</head>
<body class="card">
  <div class="panel">
    <h>Bandeja entrada personal · checkin_on</h>
    <div class="ppl">
      <div class="person">
        <span class="ic un"><i class="ti ti-mail"></i><span class="ini" style="margin-top:14px"></span><span class="dot"></span></span>
        <span class="nm">MA</span><span class="ro">pilot</span>
      </div>
      <div class="person">
        <span class="ic"><i class="ti ti-mail"></i></span>
        <span class="nm">RS</span><span class="ro">carry</span>
      </div>
      <div class="person">
        <span class="ic un"><i class="ti ti-mail"></i><span class="dot"></span></span>
        <span class="nm">JP</span><span class="ro">pilot</span>
      </div>
      <div class="person">
        <span class="ic"><i class="ti ti-mail"></i></span>
        <span class="nm">LF</span><span class="ro">carry</span>
      </div>
      <div class="person">
        <span class="ic"><i class="ti ti-mail"></i></span>
        <span class="nm">AC</span><span class="ro">DUE</span>
      </div>
    </div>
  </div>
  <div style="font-family:var(--font-body);font-weight:300;font-size:11px;color:#3b2c00;margin-top:8px;line-height:1.5">
    Icono ti-mail amarillo si hay mensajes sin leer. Solo lectura — mensajes desaparecen al cerrar (auto-dismiss).
  </div>
</body></html>
